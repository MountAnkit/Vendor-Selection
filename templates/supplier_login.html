<!DOCTYPE html>
<html>
<head>
    <title>Supplier Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { 
            background: linear-gradient(rgba(26, 26, 46, 0.85), rgba(26, 26, 46, 0.9)),
                      url('/static/4196339.jpg') center/cover fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Inter', system-ui;
        }

        .login-box {
            background: rgba(26, 26, 46, 0.85);
            padding: 3rem;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            width: 400px;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(108, 92, 231, 0.1);
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        input {
            width: 100%;
            padding: 1rem;
            border: 2px solid #6C5CE7;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            color: #F8F9FA;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus {
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.2);
        }

        button {
            background: #6C5CE7;
            color: white;
            padding: 1rem 2rem;
            border: none;
            border-radius: 12px;
            width: 100%;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        h2 {
            color: #6C5CE7;
            margin-bottom: 2rem;
            font-family: 'Poppins', sans-serif;
            font-size: 1.8rem;
        }
        
        .alert {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 25px;
            background: #FF6B6B;
            color: white;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Supplier Login</h2>
        <form method="POST">
            <div class="form-group">
                <input type="email" name="email" placeholder="Email" required>
            </div>
            <div class="form-group">
                <input type="password" name="password" placeholder="Password" required>
            </div>
            <button type="submit">Login</button>
        </form>
        <p style="color: white; margin-top: 1rem;">
            Don't have an account? <a href="{{ url_for('supplier_register') }}" style="color: #6C5CE7;">Register here</a>
        </p>
    </div>

    <script>
        // Enhanced error handling with visual feedback
        document.querySelector('form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            const button = form.querySelector('button');
            const originalButtonText = button.innerHTML;

            try {
                // Show loading state
                button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';
                button.disabled = true;

                const formData = new FormData(form);
                const response = await fetch('/supplier/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams(formData)
                });

                if (response.ok) {
                    window.location.href = '/';
                } else {
                    const data = await response.json();
                    showErrorAlert(data.error || 'Invalid credentials');
                }
            } catch (error) {
                console.error('Login error:', error);
                showErrorAlert('Login failed. Please try again.');
            } finally {
                // Reset button state
                button.disabled = false;
                button.innerHTML = originalButtonText;
            }
        });

        function showErrorAlert(message) {
            const alertDiv = document.createElement('div');
            alertDiv.className = 'alert';
            alertDiv.textContent = message;
            
            document.body.appendChild(alertDiv);
            
            // Auto-remove after 3 seconds
            setTimeout(() => {
                alertDiv.remove();
            }, 3000);
        }
    </script>
</body>
</html>
