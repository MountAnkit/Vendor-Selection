<!DOCTYPE html>
<html>
<head>
    <title>Supplier Registration</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { 
            background: linear-gradient(rgba(26, 26, 46, 0.85), rgba(26, 26, 46, 0.9)),
                      url('/static/4196339.jpg') center/cover fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Inter', system-ui;
        }

        .login-box {
            background: rgba(26, 26, 46, 0.85);
            padding: 3rem;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            width: 400px;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(108, 92, 231, 0.1);
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        input {
            width: 100%;
            padding: 1rem;
            border: 2px solid #6C5CE7;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            color: #F8F9FA;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus {
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.2);
        }

        button {
            background: #6C5CE7;
            color: white;
            padding: 1rem 2rem;
            border: none;
            border-radius: 12px;
            width: 100%;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        h2 {
            color: #6C5CE7;
            margin-bottom: 2rem;
            font-family: 'Poppins', sans-serif;
            font-size: 1.8rem;
        }
    </style>
    <!-- Use same styles as admin_login.html -->
</head>
<body>
    <div class="login-box">
        <h2>Supplier Registration</h2>
        <form method="POST">
            <div class="form-group">
                <input type="email" name="email" placeholder="Email" required>
            </div>
            <div class="form-group">
                <input type="password" name="password" placeholder="Password" required>
            </div>
            <button type="submit">Register</button>
        </form>
        <p style="color: white; margin-top: 1rem;">
            Already registered? <a href="{{ url_for('supplier_login') }}" style="color: #6C5CE7;">Login here</a>
        </p>
    </div>
</body>
</html>
