<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { 
            background: linear-gradient(rgba(26, 26, 46, 0.85), rgba(26, 26, 46, 0.9)),
                      url('/static/4196339.jpg') center/cover fixed;
            padding: 2rem;
            min-height: 100vh;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(26, 26, 46, 0.8);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            overflow: hidden;
            border: 2px solid rgba(108, 92, 231, 0.1);
        }

        th, td {
            padding: 1.2rem;
            text-align: left;
            border-bottom: 1px solid rgba(108, 92, 231, 0.1);
            color: #F8F9FA;
        }

        th {
            background: rgba(108, 92, 231, 0.9);
            color: white;
            font-family: 'Poppins', sans-serif;
            backdrop-filter: blur(10px);
        }

        tr:hover {
            background: rgba(108, 92, 231, 0.05);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .logout-btn {
            background: #FF6B6B;
            color: white;
            padding: 0.7rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
        }

        .logout-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .delete-btn {
            background: #FF6B6B;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .delete-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 style="color: #6C5CE7; font-family: 'Poppins';">Recommended Vendors</h1>
        <a href="{{ url_for('admin_logout') }}" class="logout-btn">
            <i class="fas fa-sign-out-alt"></i> Logout
        </a>
    </div>
    
    <table>
        <thead>
            <tr>
                <th>Supplier Name</th>
                <th>Price</th>
                <th>Location</th>
                <th>Defect Rate</th>
                <th>Total Costs</th>
                <th>Confidence</th>
                <th>Email</th>
                <th>Date Added</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for vendor in vendors %}
            <tr>
                <td>{{ vendor[1] }}</td>
                <td>${{ vendor[2] }}</td>
                <td>{{ vendor[3] }}</td>
                <td>{{ vendor[4] }}%</td>
                <td>${{ vendor[5] }}</td>
                <td>{{ vendor[6] }}%</td>
                <td>{{ vendor[7] }}</td>
                <td>{{ vendor[8] }}</td>
                <td>
                    <button class="delete-btn" onclick="deleteVendor({{ vendor[0] }})">
                        <i class="fas fa-trash"></i> Delete
                    </button>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <script>
        function deleteVendor(id) {
            if(confirm('Are you sure you want to permanently delete this vendor?')) {
                fetch(`/delete/${id}`, { method: 'DELETE' })
                    .then(response => {
                        if(response.ok) window.location.reload();
                        else alert('Failed to delete vendor');
                    })
                    .catch(error => console.error('Error:', error));
            }
        }
    </script>
</body>
</html>
